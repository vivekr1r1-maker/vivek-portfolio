<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#131d40"/>
    </linearGradient>
    <linearGradient id="aiCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#avatarBg)"/>

  <!-- AI Neural Grid Lines -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
  <line x1="200" y1="40" x2="200" y2="320" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>

  <!-- Center Portrait Silhouette / Tech Avatar Frame -->
  <circle cx="200" cy="150" r="55" fill="#0f1a3a" stroke="url(#aiCircleGrad)" stroke-width="3" filter="url(#aiGlow)"/>
  
  <!-- Stylized Monogram "V" -->
  <path d="M175 130 L200 175 L225 130" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="175" r="3.5" fill="#ffffff"/>

  <!-- Shoulders outline -->
  <path d="M120 280 C 130 225, 160 215, 200 215 C 240 215, 270 225, 280 280 Z" fill="#0c1633" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2"/>

  <!-- Banner text: Upload Photo Placeholder -->
  <rect x="70" y="300" width="260" height="42" rx="10" fill="#060c1d" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
  <text x="200" y="326" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#00f0ff" text-anchor="middle">
    📸 Profile Photo Placeholder
  </text>
  <text x="200" y="365" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    Replace with your photo in assets/images/
  </text>

  <!-- Camera / Upload Icon Badge at Top Right -->
  <g transform="translate(265, 85)">
    <circle cx="20" cy="20" r="22" fill="#040814" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M12 24 L14 17 L18 17 L20 15 L28 15 L30 17 L34 17 L36 24 Z" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="24" cy="22" r="4" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  </g>
</svg>

